version: '3.8'

services:
  census-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: census-rag-app
    ports:
      - "8501:8501"
    volumes:
      # Mount ObjectBox database for persistence
      - ./objectbox:/app/objectbox
      # Mount PDF data directory
      - ./us-census-data:/app/us-census-data
      # Mount .env file for configuration
      - ./.env:/app/.env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - census-rag-network

networks:
  census-rag-network:
    driver: bridge

volumes:
  objectbox_data:
    driver: local
